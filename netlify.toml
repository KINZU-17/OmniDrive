[build]
  publish = "web/dist"
  command = "cd web && npm install && npm run build"

# Proxy /api/* to the Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://omnidrive-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA catch-all — must come LAST so React Router handles all non-file routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets aggressively (they have content hashes in filenames)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML (so new deploys are picked up immediately)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
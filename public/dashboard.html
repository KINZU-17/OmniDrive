<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDrive Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-shell">
        <header class="dashboard-header">
            <div>
                <p class="brand-label">OmniDrive</p>
                <h1 id="dashboardTitle">Dashboard</h1>
                <p id="dashboardSubtitle" class="dashboard-subtitle">Loading your dashboard...</p>
            </div>
            <div class="user-actions">
                <div class="user-pill" id="userPill"><span class="dot"></span>Signed in</div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </header>

        <main class="dashboard-main">
            <section class="summary-grid" id="summaryGrid"></section>

            <section class="dashboard-panel" id="dashboardPanel">
                <div class="panel-header">
                    <div>
                        <h2 id="panelTitle">Overview</h2>
                        <p id="panelSubtitle">Your personalized dashboard experience</p>
                    </div>
                </div>
                <div id="panelContent"></div>
            </section>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
